# Local cross-architecture validation on an x86-64 Engine with ARM64 emulation.
# Native ARM64 hosts select ARM64 images automatically without this overlay.
services:
  database:
    platform: linux/arm64
  migrate:
    platform: linux/arm64
  api:
    platform: linux/arm64
    healthcheck:
      timeout: 20s
      start_period: 600s
  worker:
    platform: linux/arm64
    healthcheck:
      timeout: 20s
      start_period: 600s
  frontend:
    platform: linux/arm64
    healthcheck:
      timeout: 20s
      start_period: 600s
